[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adintel"
version = "0.1.0"
description = "Multi-platform intelligence collection and query service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "AdIntel" }
]
dependencies = [
  "playwright>=1.52",
  "playwright-stealth>=1.0.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]
mcp = [
  "httpx>=0.27",
  "mcp>=1.0.0",
]

[project.scripts]
adintel = "adintel.cli.main:app"
adintel-mcp = "adintel.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adintel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
